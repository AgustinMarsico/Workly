name: Frontend Build Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: workly-front/package-lock.json

      - name: Instalar dependencias
        working-directory: ./workly-front
        run: npm ci --legacy-peer-deps

      - name: Compilar aplicación
        working-directory: ./workly-front
        run: npm run build